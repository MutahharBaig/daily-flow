<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dayflow</title>
<style>
:root{--bg:#fff7ee;--card:#ffffff;--ink:#2b2118;--mut:#8a7765;--acc:#ff7a3d;--acc2:#ffb347;--ok:#2f9e6b;--bad:#d64545;--line:#f0e2d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--card:#241b14;--ink:#fbeedd;--mut:#b09a84;--line:#3a2d22}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif;min-height:100vh}
h1,h2,h3{margin:0;font-weight:700}.sans,button,input,select,textarea{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.hero small{opacity:.9;font-family:sans-serif}.hero h1{font-size:28px;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.task{display:flex;gap:12px;align-items:flex-start}
.task .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);flex:none;background:none;color:#fff;padding:0;font-size:15px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}.task.done .t{text-decoration:line-through;opacity:.5}
.t{font-weight:700}.m{color:var(--mut);font-size:13px;font-family:sans-serif}
.tag{display:inline-block;font:600 11px sans-serif;padding:2px 8px;border-radius:99px;background:var(--line);margin-right:4px}
.tag.late{background:var(--bad);color:#fff}.tag.al{background:var(--acc);color:#fff}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;margin:4px 0 10px}
label{font:600 13px sans-serif;color:var(--mut)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;width:100%}
.btn.g{background:var(--line);color:var(--ink)}.x{background:none;border:0;color:var(--bad);font-size:13px;padding:4px 0}
.chk2{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font:15px sans-serif}.chk2 input{width:auto;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px;font:600 12px sans-serif}nav button.on{color:var(--acc)}nav span{display:block;font-size:20px}
.ring{width:170px;height:170px;margin:6px auto;position:relative}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:34px}
#lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--acc),#c4421a);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center}
.dots{display:flex;gap:12px;margin:18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}.pad button{height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px}
#ban{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;background:var(--bad);color:#fff;border-radius:16px;padding:14px;z-index:40;display:none;font-family:sans-serif;box-shadow:0 8px 30px #0006}
.paper{background:#fff;color:#222;border-radius:6px;padding:22px;box-shadow:0 4px 24px #0003;font-family:Georgia,serif}.paper h2{border-bottom:2px solid #ff7a3d;padding-bottom:6px}.paper li{margin:6px 0}
.hide{display:none!important}
</style></head><body>
<div id="lock"></div>
<div id="ban"></div>
<div class="wrap" id="app"></div>
<nav class="sans"><button data-v="today"><span>☀️</span>Today</button><button data-v="add"><span>＋</span>Add</button><button data-v="steps"><span>👟</span>Steps</button><button data-v="reports"><span>📄</span>Reports</button></nav>
<script>
const K='dayflow_v1';let D={pin:null,tasks:[],steps:{},reports:{}};
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const due=t=>new Date(t.date+'T'+(t.time||'23:59'));
let view='today',buf='',first=false,tmpPin='';
// 90-day retention
function purge(){const lim=new Date();lim.setDate(lim.getDate()-90);const l=dstr(lim);
D.tasks=D.tasks.filter(t=>t.date>=l);for(const o of['steps','reports'])for(const k in D[o])if(k<l)delete D[o][k];save()}
// hash
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dayflow'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(p)}}
function lockUI(msg){
$('#lock').classList.remove('hide');
$('#lock').innerHTML=`<div style="font-size:46px">🌅</div><h1>Dayflow</h1><p class="sans">${msg}</p><div class="dots">${[...Array(Math.max(4,buf.length))].map((_,i)=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}</div><div class="pad sans">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button ${k==='✓'?'style="background:#fff;color:#c4421a;font-weight:700"':''} onclick="key('${k}')">${k}</button>`).join('')}</div><p class="sans" style="opacity:.85;font-size:13px">4–6 digits, then press ✓</p>`}
async function key(k){if($('#lock').classList.contains('hide'))return;if(k==='⌫')buf=buf.slice(0,-1);else if(k!=='✓'&&buf.length<6)buf+=k;
lockUI(msgNow());if(k!=='✓')return;if(buf.length<4)return lockUI('PIN must be at least 4 digits');
const h=await hash(buf);
if(!D.pin){if(!tmpPin){tmpPin=h;buf='';return lockUI('Now enter the same PIN again and press ✓')}
if(tmpPin===h){D.pin=h;save();unlock()}else{tmpPin='';buf='';lockUI('PINs did not match. Create again')}}
else if(D.pin===h)unlock();else{buf='';lockUI('Wrong PIN. Try again')}}
const msgNow=()=>!D.pin?(tmpPin?'Now enter the same PIN again and press ✓':'Create your PIN'):'Enter your PIN';
function unlock(){buf='';$('#lock').classList.add('hide');purge();render();start()}
lockUI(msgNow());
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('✓')});
// notifications + sound
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(o=>{const s=c.createOscillator(),g=c.createGain();s.connect(g);g.connect(c.destination);s.frequency.value=880;g.gain.value=.2;s.start(c.currentTime+o);s.stop(c.currentTime+o+.15)})}catch(e){}}
function alertUser(t,text){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);
const b=$('#ban');b.style.display='block';b.innerHTML=`<b>⏰ ${esc(t.title)}</b><div>${text}</div><button class="btn g" style="margin-top:8px" onclick="openTask('${t.id}')">View task</button>`;
try{if('Notification'in window&&Notification.permission==='granted')new Notification('⏰ '+t.title,{body:text,tag:t.id})}catch(e){}}
function openTask(id){const t=D.tasks.find(x=>x.id===id);if(t){t.viewed=true;save()}$('#ban').style.display='none';view='today';render()}
const last={};
function tick(){const now=Date.now();
D.tasks.forEach(t=>{if(t.done)return;const d=due(t).getTime();
if(t.alarm&&!t.alarmed&&now>=d&&now-d<6*3600e3){t.alarmed=true;save();alertUser(t,'It’s time: '+t.time)}
if(t.alertBefore&&!t.viewed&&now<d&&now>=d-(t.mins||15)*60000){if(!last[t.id]||now-last[t.id]>=10000){last[t.id]=now;alertUser(t,'Due at '+t.time+' — tap to acknowledge')}}});
const n=new Date();if(n.getHours()>=22&&n.getMinutes()>=30||n.getHours()>=23){if(!D.reports[today()]){makeReport();notifyReport()}}}
function notifyReport(){try{if(Notification.permission==='granted')new Notification('🌙 Pending tasks report ready',{body:'Open Dayflow → Reports'})}catch(e){}if(view==='reports')render()}
let started=false;function start(){if(started)return;started=true;setInterval(tick,1000);tick();
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
// report
function makeReport(){const t0=today(),p=D.tasks.filter(t=>!t.done).sort((a,b)=>due(a)-due(b));
D.reports[t0]={at:new Date().toISOString(),items:p.map(t=>({title:t.title,date:t.date,time:t.time,notes:t.notes})),steps:D.steps[t0]||0};save()}
function reportHTML(k){const r=D.reports[k];return`<div class="paper"><h2>Pending tasks · ${k}</h2><p class="m">Generated ${new Date(r.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · Steps today: ${r.steps}</p>${r.items.length?'<ol>'+r.items.map(i=>`<li><b>${esc(i.title)}</b><br><span class="m">${i.date<k?'OVERDUE · ':''}${i.date} ${i.time||''}${i.notes?' — '+esc(i.notes):''}</span></li>`).join('')+'</ol>':'<p>🎉 Nothing pending. Rest well!</p>'}</div>`}
// steps
let sOn=false,sLast=0,sc=0,sMsg='',base=9.8,got=0,sBound=false;
function stepOn(){const go=()=>{if(!sBound){sBound=true;window.addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;got++;const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z),n=Date.now();base=base*.9+m*.1;
if(m-base>1.6&&n-sLast>300){sLast=n;D.steps[today()]=(D.steps[today()]||0)+1;if(++sc%10==0)save();if(view==='steps')render()}})}sOn=true;sMsg='';got=0;render();setTimeout(()=>{if(!got){sOn=false;sMsg='No motion data received. Open the app link directly in Safari/Chrome (not inside another app), allow Motion access, and try again. You can also add steps manually.';render()}},3000)};
try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')go();else{go();setTimeout(()=>{if(!got){sMsg='Motion permission was denied. Open the https link in Chrome (not a saved file) and allow Motion sensors in Site settings.';render()}},3100)}}).catch(()=>{sMsg='Could not ask for motion permission here. Open the link directly in Safari.';render()});else go()}catch(e){sMsg='Motion sensor not available. Use manual add.';render()}}
// views
function nav(v){view=v;render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
const A=$('#app');
if(view==='today'){const t0=today(),open=D.tasks.filter(t=>!t.done).sort((a,b)=>due(a)-due(b)),dn=D.tasks.filter(t=>t.done&&t.date===t0);
const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
A.innerHTML=`<div class="hero"><small>${new Date().toDateString()}</small><h1>${g} ☀️</h1><small>${open.length} pending · ${D.steps[t0]||0} steps</small></div>
${open.map(card).join('')||'<div class="card m">No pending tasks. Tap ＋ to plan your day.</div>'}
${dn.length?'<h3 class="sans m" style="margin:14px 0 8px">Done today</h3>'+dn.map(card).join(''):''}`}
else if(view==='add'){const n=new Date();A.innerHTML=`<div class="hero"><h1>New task</h1><small>Plan it. Alarm it. Done.</small></div><div class="card">
<label>Task</label><input id="f_t" placeholder="What needs to be done?">
<div class="row"><div><label>Date</label><input id="f_d" type="date" value="${today()}"></div><div><label>Time</label><input id="f_h" type="time" value="${pad(n.getHours()+1>23?23:n.getHours()+1)}:00"></div></div>
<label>Notes</label><textarea id="f_n" rows="3"></textarea>
<div class="chk2"><input type="checkbox" id="f_a" checked><label for="f_a" style="font-size:15px">Set alarm at due time</label></div>
<div class="chk2"><input type="checkbox" id="f_b"><label for="f_b" style="font-size:15px">Alert me before deadline (repeats every 10s until I open it)</label></div>
<label>Alert how many minutes before?</label><input id="f_m" type="number" value="15" min="1">
<button class="btn" onclick="addTask()">Save task</button></div>`}
else if(view==='steps'){const s=D.steps[today()]||0,goal=D.goal||8000,p=Math.min(1,s/goal),C=2*Math.PI*70;
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[dstr(d),D.steps[dstr(d)]||0]}),mx=Math.max(goal,...days.map(x=>x[1]));
A.innerHTML=`<div class="hero"><h1>Steps</h1><small>Goal ${goal}</small></div><div class="card"><div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="85" cy="85" r="70" fill="none" stroke="var(--acc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div><b>${s}</b><span class="m">steps today</span></div></div>
${sOn?'<p class="m" style="text-align:center">Counting all day, even when the app is closed.</p>':(sMsg?`<p class="m" style="color:var(--bad)">${sMsg}</p>`:'')+'<button class="btn" onclick="stepOn()">Start step counting</button>'}
<div class="row" style="margin-top:12px"><input id="ms" type="number" placeholder="Add steps manually"><button class="btn g" style="flex:0 0 90px;margin:4px 0 10px" onclick="addSteps()">Add</button></div></div>
<div class="card"><h3>Last 7 days</h3><div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px">${days.map(([d,v])=>`<div style="flex:1;text-align:center" class="m"><div style="background:var(--acc);border-radius:6px;height:${Math.max(3,v/mx*80)}px"></div>${d.slice(8)}</div>`).join('')}</div></div>
<p class="m">Steps come from your phone’s built-in step counter. Use manual add to correct them.</p>`}
else{const ks=Object.keys(D.reports).sort().reverse();
A.innerHTML=`<div class="hero"><h1>Reports</h1><small>Pending-task PDF-style reports, made nightly at 10:30 PM</small></div><button class="btn" onclick="makeReport();render()" style="margin-bottom:12px">Generate today’s report now</button>
${ks.map(k=>`<div class="card" onclick="showR('${k}')"><b>📄 Pending report · ${k}</b><div class="m">${D.reports[k].items.length} pending · tap to open</div></div>`).join('')||'<div class="card m">No reports yet.</div>'}`}}
function showR(k){$('#app').innerHTML=`<button class="btn g" style="margin-bottom:12px" onclick="render()">← Back</button>`+reportHTML(k)}
function card(t){const late=!t.done&&due(t)<new Date();return`<div class="card task ${t.done?'done':''}"><button class="chk" onclick="tog('${t.id}')">${t.done?'✓':''}</button><div style="flex:1" onclick="openTask('${t.id}')"><div class="t">${esc(t.title)}</div><div class="m">${t.date} · ${t.time}</div>${t.notes?`<div class="m">${esc(t.notes)}</div>`:''}<div style="margin-top:4px">${late?'<span class="tag late">Overdue</span>':''}${t.alarm?'<span class="tag al">⏰ alarm</span>':''}${t.alertBefore?`<span class="tag">🔔 ${t.mins}m before${t.viewed?' · seen':''}</span>`:''}</div></div><button class="x" onclick="del('${t.id}')">✕</button></div>`}
function addTask(){const title=$('#f_t').value.trim();if(!title){$('#f_t').focus();return}
D.tasks.push({id:'t'+Date.now(),title,date:$('#f_d').value||today(),time:$('#f_h').value||'09:00',notes:$('#f_n').value,alarm:$('#f_a').checked,alertBefore:$('#f_b').checked,mins:+$('#f_m').value||15});save();
if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();view='today';render()}
function tog(id){const t=D.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function del(id){if(confirm('Delete this task?')){D.tasks=D.tasks.filter(x=>x.id!==id);save();render()}}
function addSteps(){const v=+$('#ms').value;if(v>0){D.steps[today()]=(D.steps[today()]||0)+v;save();render()}}
</script><script src="native.js"></script></body></html>
